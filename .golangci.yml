---
version: "2"

run:
  timeout: 1m

linters:
  default: all
  disable:
    - wrapcheck
    - testpackage
    - contextcheck
    - gochecknoglobals
    - exhaustruct
    - paralleltest
    - godox
    - cyclop
    - tagliatelle
    - err113
    - varnamelen
    - ireturn
    - exhaustive
    - dupword
    - depguard
    - testifylint
    - perfsprint
    - mnd
    - wsl
    - nlreturn
    - funlen
    - gocognit
    - noctx
    - staticcheck
    - errcheck
    - intrange
    - gosec
    - nestif
    - goconst
    - prealloc
    - lll
    - maintidx
    - gochecknoinits
    - forbidigo
    - revive
    # Opinionated v2 linters not adopted by this codebase; disabled to avoid
    # churning pre-existing files (house style: inline error handling, package
    # docs in both doc.go and the main file). Re-enable as a dedicated PR.
    - godoclint
    - wsl_v5
    - usetesting
    - noinlineerr
    - embeddedstructfieldcheck
    - funcorder
    # golangci-lint v2.5.0 (built with go1.25) can't lint a go1.26+ module, so
    # this PR also raises GOLANGCI_VERSION to v2.9.0 (earliest release built
    # with go1.26). That version's `modernize` linter is new to this repo and
    # flags ~400 pre-existing interface{}/loop/reflect style points across
    # every package -- unrelated to the CVE fix this PR makes. Disabled here
    # for the same reason as the block above; re-enable as a dedicated PR.
    - modernize

  settings:
    funlen:
      lines: 175
      statements: 80

    nestif:
      min-complexity: 8

    revive:
      rules:
        - name: unused-parameter
          disabled: true

  exclusions:
    rules:
      - path: cmd/
        linters:
          - gochecknoinits
          - mnd
          - forbidigo
          - errcheck
          - lll
          - goconst
          - intrange
          - revive

      - path: awsssm/
        linters:
          - lll

      - path: awssm/
        linters:
          - lll

      - path: example_test.go
        linters:
          - lll

      - path: github/github.go
        linters:
          - mnd

      - path: util/
        linters:
          - mnd
          - gocognit
          - gocyclo
          - funlen
          - maintidx
          - dupl
          - goconst
          - nestif

      - path: _test\.go
        linters:
          - wsl
          - nlreturn
          - funlen
          - dupl
          - gocognit
          - maintidx
          - goconst
          - lll
          - revive

      - path: doc.go
        linters:
          - lll
          - revive

      - path: parsers/
        linters:
          - revive

      - path: parser/
        linters:
          - revive

      - path: util/
        linters:
          - revive

      - path: option/
        linters:
          - revive

      - linters:
          - lll
        source: "json:"

      - linters:
          - gocritic
          - godot
        source: "//////"

      - linters:
          - gosec
        text: "G112:"
